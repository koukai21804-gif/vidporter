[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidporter"
version = "0.2.0"
description = "统一的多平台视频提取工具：B站 / 抖音 / 快手 / 小红书 / 微信视频号 / 1800+ 其它站点"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vidporter contributors" }]
keywords = [
    "bilibili",
    "douyin",
    "kuaishou",
    "xiaohongshu",
    "wechat-channels",
    "video-downloader",
    "yt-dlp",
    "subtitle",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2024.12.13",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "segno>=1.6",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
cdp = ["websocket-client>=1.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.9,<0.17",
    "websocket-client>=1.8",
]
build = ["pyinstaller>=6.0"]

[project.scripts]
vidporter = "vidporter.cli:main"

[project.urls]
Homepage = "https://github.com/koukai21804-gif/vidporter"
Documentation = "https://github.com/koukai21804-gif/vidporter#readme"
Changelog = "https://github.com/koukai21804-gif/vidporter/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# B008: typer 的 Option/Argument 必须写在参数默认值里，属框架约定
# UP031: 日志回调里保留 %-format 以延迟求值
ignore = ["SIM108", "B008", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["vidporter"]
